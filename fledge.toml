# fledge.toml — rune project task definitions
# Docs: https://github.com/CorvidLabs/fledge#task-runner

[tasks]
dev = "ruby bin/rune"
test = "bundle exec rspec"
lint = "bundle exec rubocop"
fmt = "bundle exec rubocop -A"
fmt-check = "bundle exec rubocop"
build = "gem build rune.gemspec"
install = "bundle install"
spec-check = "if command -v specsync >/dev/null 2>&1; then specsync check --force --strict --stale 1 --require-coverage 100; else echo 'specsync is required' >&2; exit 1; fi"
spec-lifecycle = "specsync lifecycle enforce --all"
# --range is explicit so the gate never inspects zero commits: `fledge trust
# verify`'s own default is origin/main..HEAD, which is empty on main and makes
# the risk and provenance checks pass vacuously. scripts/trust_range.sh applies
# the same fallback CI uses, and exits non-zero rather than yield an empty range.
trust = "fledge trust verify --range \"$(./scripts/trust_range.sh)\""
trust-range = "./scripts/trust_range.sh"
clean = "rm -f *.gem"
smoke-test = "ruby examples/smoke_test.rb"
set-version = "ruby scripts/set_release_version.rb \"$1\""
version-check = "ruby scripts/check_release_version.rb"

[lanes.verify]
description = "Full CI gate: version parity, lint, tests, and spec-sync."
steps = ["version-check", "fmt-check", "lint", "test", "spec-check", "spec-lifecycle"]

[lanes.check]
description = "Fast quality check: lint + tests."
steps = ["lint", "test"]

[lanes.release]
description = "Release gate: full verification, smoke tests, and gem build."
steps = ["version-check", "fmt-check", "lint", "test", "spec-check", "spec-lifecycle", "smoke-test", "build"]

[lanes.fix]
description = "Auto-fix: format, then lint to show remaining issues."
steps = ["fmt", "lint"]
