# fledge.toml — rune project task definitions
# Docs: https://github.com/CorvidLabs/fledge#task-runner

[tasks]
dev = "ruby bin/rune"
test = "bundle exec rspec"
lint = "bundle exec rubocop"
fmt = "bundle exec rubocop -A"
fmt-check = "bundle exec rubocop"
build = "gem build rune.gemspec"
install = "bundle install"
spec-check = "which specsync >/dev/null 2>&1 && specsync check || echo 'specsync skipped (not in PATH)'"
trust = "fledge trust verify"
clean = "rm -f *.gem"

[lanes.verify]
description = "Full CI gate: lint, tests, and spec-sync."
steps = ["fmt-check", "lint", "test", "spec-check"]

[lanes.check]
description = "Fast quality check: lint + tests."
steps = ["lint", "test"]

[lanes.fix]
description = "Auto-fix: format, then lint to show remaining issues."
steps = ["fmt", "lint"]
