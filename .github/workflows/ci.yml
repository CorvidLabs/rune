name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # augur and attest need full git history

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.5'
          bundler-cache: true

      - name: Install Fledge
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/CorvidLabs/fledge/releases/download/v1.7.0/fledge-linux-x86_64 -o "$HOME/.local/bin/fledge" || curl -fsSL https://raw.githubusercontent.com/CorvidLabs/fledge/main/install.sh | bash || true
          chmod +x "$HOME/.local/bin/fledge" 2>/dev/null || true
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Fledge Verification Lane
        run: |
          bundle exec rspec
          bundle exec rubocop

      - name: Spec Sync Contract Check
        uses: CorvidLabs/spec-sync@v5.2.0
        with:
          strict: "true"
        continue-on-error: true

      - name: Augur Risk Gate
        uses: CorvidLabs/augur@v1
        with:
          threshold: block
        continue-on-error: true

      - name: Attest Provenance Check
        uses: CorvidLabs/attest@v1
        with:
          policy: .attest.json
        continue-on-error: true

      - name: Verify Trust Block Present
        run: |
          grep -q "CorvidLabs trust toolchain: BEGIN" AGENTS.md
