name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read

jobs:
  verify:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.0', '3.1', '3.2', '3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: '2.4.22'
          bundler-cache: true

      - name: Install Fledge
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://raw.githubusercontent.com/CorvidLabs/fledge/main/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Fledge checks
        run: |
          fledge run test
          fledge run lint

  trust:
    name: Trust gate
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Spec Sync Contract Check
        uses: CorvidLabs/spec-sync@v5.2.0
        with:
          strict: "true"
          require-coverage: "100"

      - name: Augur Risk Gate
        uses: CorvidLabs/augur@1.0.0
        with:
          threshold: block

      - name: Attest Provenance Check
        uses: CorvidLabs/attest@1.0.0
        with:
          policy: .attest.json

      - name: Verify Trust Block Present
        run: |
          grep -q "CorvidLabs trust toolchain: BEGIN" AGENTS.md
