name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read

jobs:
  verify:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: '3.0'
            bundler: '2.4.22'
          - ruby: '3.1'
            bundler: '2.4.22'
          - ruby: '3.2'
            bundler: '2.4.22'
          - ruby: '3.3'
            bundler: '2.4.22'
          - ruby: '3.4'
            bundler: '2.4.22'
          - ruby: '4.0'
            bundler: 'default'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: ${{ matrix.bundler }}
          bundler-cache: true

      - name: Install Fledge
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://raw.githubusercontent.com/CorvidLabs/fledge/main/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Fledge checks
        run: |
          fledge run version-check
          fledge run test
          fledge run lint

  spec-sync:
    name: Spec Sync
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Ruby 3.3
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler: '2.4.22'
          bundler-cache: true

      - name: Install Fledge
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://raw.githubusercontent.com/CorvidLabs/fledge/main/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Deliberately not `--strict` and without `--stale N`. The contract itself
      # (specs match code, coverage stays complete) is the part worth gating on;
      # the strict/staleness knobs were rejecting work for bookkeeping reasons
      # rather than for any drift between the specs and the code. Revisit when
      # spec-sync 6 lands, which reworks the change-verification model.
      - name: Spec Sync Contract Check
        uses: CorvidLabs/spec-sync@v5.2.0
        with:
          require-coverage: "100"
          lifecycle-enforce: "true"
