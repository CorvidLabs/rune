name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read

jobs:
  verify:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: '3.0'
            bundler: '2.4.22'
          - ruby: '3.1'
            bundler: '2.4.22'
          - ruby: '3.2'
            bundler: '2.4.22'
          - ruby: '3.3'
            bundler: '2.4.22'
          - ruby: '3.4'
            bundler: '2.4.22'
          - ruby: '4.0'
            bundler: 'default'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: ${{ matrix.bundler }}
          bundler-cache: true

      - name: Install Fledge
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://raw.githubusercontent.com/CorvidLabs/fledge/main/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Fledge checks
        run: |
          fledge run version-check
          fledge run test
          fledge run lint

  trust:
    name: Trust gate
    needs: verify
    runs-on: ubuntu-latest
    # pull-requests: read lets the push-event range resolution below map a
    # landed squash commit back to the reviewed pull request head it came from.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Fetch Attest Notes
        run: git fetch origin refs/notes/attest:refs/notes/attest

      # Both the Augur and Attest actions default to `origin/main..HEAD`. That
      # is right for a pull request and wrong for a push to main, where HEAD is
      # origin/main and the range is empty — the gates then reported
      # "PASS (0 commits checked)" and "risk 0/100" while inspecting nothing,
      # which is how two unattested commits reached main under a green build.
      - name: Resolve trust range
        id: trust-range
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          forwards_file="${RUNNER_TEMP}/attest-forwards.tsv"
          : > "${forwards_file}"
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            range="origin/main..HEAD"
          elif [ "${EVENT_NAME}" = "push" ]; then
            range="$(TRUST_PUSH_BEFORE_SHA="${PUSH_BEFORE_SHA}" \
              TRUST_PUSH_AFTER_SHA="${PUSH_AFTER_SHA}" \
              ./scripts/trust_range.sh)"
            # Pull requests are squash-merged, so provenance on the reviewed
            # head SHA does not apply to the differently-hashed landed commit.
            # Map every landed commit in the push to its source PR head (covers
            # multi-PR stack merges that land as several squash commits in one
            # push). Direct pushes with no PR emit zero rows and are verified
            # strictly on their own merits.
            ./scripts/squash_attest_forwards.sh "${PUSH_BEFORE_SHA}" "${PUSH_AFTER_SHA}" \
              > "${forwards_file}"
          else
            echo "::error::Unsupported trust event '${EVENT_NAME}'; refusing to guess a commit range."
            exit 1
          fi
          echo "range=${range}" >> "$GITHUB_OUTPUT"
          echo "forwards_file=${forwards_file}" >> "$GITHUB_OUTPUT"
          echo "Resolved trust range: ${range}"
          if [ -s "${forwards_file}" ]; then
            echo "Squash-merge attestation forwards:"
            cat "${forwards_file}"
          else
            echo "No squash-merge PR heads to forward."
          fi

      # The load-bearing guard. Any future event type, checkout shape, or
      # base-ref change that yields an empty range fails loudly here instead of
      # silently reporting a green gate that examined nothing.
      - name: Reject a vacuous trust range
        run: |
          set -euo pipefail
          count="$(git rev-list --count '${{ steps.trust-range.outputs.range }}')"
          echo "Trust range contains ${count} commit(s)."
          if [ "${count}" -eq 0 ]; then
            echo "::error::Trust range '${{ steps.trust-range.outputs.range }}' contains 0 commits; the risk and provenance gates would pass vacuously."
            exit 1
          fi

      - name: Set up Ruby 3.3
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler: '2.4.22'
          bundler-cache: true

      - name: Install Fledge
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://raw.githubusercontent.com/CorvidLabs/fledge/main/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Spec Sync Contract Check
        uses: CorvidLabs/spec-sync@v5.2.0
        with:
          strict: "true"
          require-coverage: "100"
          args: "--stale 1"
          lifecycle-enforce: "true"

      - name: Augur Risk Gate
        uses: CorvidLabs/augur@1.0.0
        with:
          range: ${{ steps.trust-range.outputs.range }}
          threshold: block

      # Squash-merge drops the reviewed PR-head commit from main's history, so a
      # plain checkout of main cannot resolve `attest forward --from <pr-head>`.
      # Fetch each PR head via refs/pull/N/head (still available after the
      # branch is deleted), then forward provenance onto the landed squash
      # commit(s) before the policy verify step. Stacked multi-PR pushes get
      # one forward per landed squash commit — the previous single-tip forward
      # left intermediate stack commits unattested.
      - name: Forward squash-merge attestations
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          FORWARDS_FILE: ${{ steps.trust-range.outputs.forwards_file }}
        run: |
          set -euo pipefail
          if [ ! -s "${FORWARDS_FILE}" ]; then
            echo "No squash-merge PR heads to forward."
            exit 0
          fi

          tmp="$(mktemp -d)"
          # Pin to the same major the CorvidLabs/attest action uses so CI and
          # the subsequent verify step share one provenance tool version.
          asset="attest-linux-x86_64"
          gh release download 1.0.0 --repo CorvidLabs/attest \
            --pattern "${asset}" --pattern "${asset}.sha256" \
            --dir "${tmp}" --clobber
          if [ -f "${tmp}/${asset}.sha256" ]; then
            expected="$(cut -d' ' -f1 < "${tmp}/${asset}.sha256")"
            actual="$(sha256sum "${tmp}/${asset}" | cut -d' ' -f1)"
            if [ "${expected}" != "${actual}" ]; then
              echo "::error::attest checksum mismatch for ${asset}"
              exit 1
            fi
          fi
          chmod +x "${tmp}/${asset}"
          attest="${tmp}/${asset}"

          # `git notes add` (used by `attest forward`) creates a notes commit and
          # requires author identity. GitHub-hosted runners have none configured.
          git config user.email "ci+attest-forward@github-actions.invalid"
          git config user.name "github-actions[bot]"

          while IFS=$'\t' read -r from to pr; do
            [ -z "${from:-}" ] && continue
            echo "Forwarding attestation: PR #${pr} ${from} -> ${to}"
            # Named ref keeps the PR-head object reachable after the branch is
            # deleted; a bare FETCH_HEAD fetch is easy to overwrite mid-loop.
            git fetch --no-tags origin "refs/pull/${pr}/head:refs/temp/pr-${pr}"
            if ! git cat-file -e "${from}^{commit}" 2>/dev/null; then
              echo "::error::PR #${pr} head ${from} still unavailable after fetch"
              exit 1
            fi
            "${attest}" forward --from "${from}" --to "${to}" --reviewer ci:squash-merge-forward
          done < "${FORWARDS_FILE}"

      - name: Attest Provenance Check
        uses: CorvidLabs/attest@1.0.0
        with:
          range: ${{ steps.trust-range.outputs.range }}
          policy: .attest.json

      - name: Verify Trust Block Present
        run: |
          grep -q "CorvidLabs trust toolchain: BEGIN" AGENTS.md
