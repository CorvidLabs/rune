name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read

jobs:
  verify:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: '3.0'
            bundler: '2.4.22'
          - ruby: '3.1'
            bundler: '2.4.22'
          - ruby: '3.2'
            bundler: '2.4.22'
          - ruby: '3.3'
            bundler: '2.4.22'
          - ruby: '3.4'
            bundler: '2.4.22'
          - ruby: '4.0'
            bundler: 'default'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: ${{ matrix.bundler }}
          bundler-cache: true

      # Pinned, and fetched as a release asset rather than through the install
      # script. That script resolves "latest" via the unauthenticated GitHub API,
      # which is rate-limited per IP — and Actions runners share IPs, so with
      # seven jobs calling it on every push the lookup intermittently returned
      # nothing and the job died with "could not determine latest version".
      # Four CI runs were lost to it. A direct release download makes no API
      # call at all. (fledge ships no action.yml, unlike spec-sync below, so
      # there is no marketplace action to use instead.)
      - name: Install Fledge
        env:
          FLEDGE_VERSION: v1.7.2
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 3 --retry-all-errors \
            "https://github.com/CorvidLabs/fledge/releases/download/${FLEDGE_VERSION}/fledge-linux-x86_64" \
            -o "$HOME/.local/bin/fledge"
          chmod +x "$HOME/.local/bin/fledge"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Fledge checks
        run: |
          fledge run version-check
          fledge run test
          fledge run lint

  # Deliberately not `needs: verify`. The two jobs check different things and
  # neither depends on the other, so gating one on the other only adds latency:
  # measured on this repo the matrix takes ~66s and Spec Sync ~87s, so running
  # them in sequence costs ~2m40s for a result available in ~90s side by side.
  # Spec Sync is also the slower of the two today and re-runs the same
  # lint/test lane internally, so "fail fast on the cheap check first" does not
  # apply — putting it first would cost the same ~2m40s.
  #
  # Revisit when spec-sync 6 lands: it is expected to be the *fast* check, at
  # which point the fail-fast ordering does pay off and this should become the
  # first job with the matrix gated behind it.
  spec-sync:
    name: Spec Sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Ruby 3.3
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler: '2.4.22'
          bundler-cache: true

      # Pinned, and fetched as a release asset rather than through the install
      # script. That script resolves "latest" via the unauthenticated GitHub API,
      # which is rate-limited per IP — and Actions runners share IPs, so with
      # seven jobs calling it on every push the lookup intermittently returned
      # nothing and the job died with "could not determine latest version".
      # Four CI runs were lost to it. A direct release download makes no API
      # call at all. (fledge ships no action.yml, unlike spec-sync below, so
      # there is no marketplace action to use instead.)
      - name: Install Fledge
        env:
          FLEDGE_VERSION: v1.7.2
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 3 --retry-all-errors \
            "https://github.com/CorvidLabs/fledge/releases/download/${FLEDGE_VERSION}/fledge-linux-x86_64" \
            -o "$HOME/.local/bin/fledge"
          chmod +x "$HOME/.local/bin/fledge"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Deliberately not `--strict` and without `--stale N`. The contract itself
      # (specs match code, coverage stays complete) is the part worth gating on;
      # the strict/staleness knobs were rejecting work for bookkeeping reasons
      # rather than for any drift between the specs and the code. Revisit when
      # spec-sync 6 lands, which reworks the change-verification model.
      - name: Spec Sync Contract Check
        uses: CorvidLabs/spec-sync@29392630a590c13fcca65bec2a3c0a8f8c9e4081 # v6.0.0-rc.12
        with:
          version: 6.0.0-rc.12
          require-coverage: "100"
          lifecycle-enforce: "true"
