name: trust

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # augur and attest need full history

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install Fledge
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://raw.githubusercontent.com/CorvidLabs/fledge/main/install.sh | bash || true
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Fledge Verification Lane
        run: |
          bundle exec rspec
          bundle exec rubocop

      - name: Spec Sync Contract Check
        uses: CorvidLabs/spec-sync@v5.2.0
        with:
          strict: "true"
        continue-on-error: true

      - name: Augur Risk Gate
        uses: CorvidLabs/augur@1.0.0
        with:
          threshold: block
        continue-on-error: true

      - name: Attest Provenance Check
        uses: CorvidLabs/attest@1.0.0
        with:
          policy: .attest.json
        continue-on-error: true

      - name: Verify Trust Block Present
        run: |
          grep -q "CorvidLabs trust toolchain: BEGIN" AGENTS.md
