name: trust

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # The Trust lifecycle lane is `fledge lanes run verify`, whose steps shell
      # out to `bundle exec` (fmt-check, lint, test). Without Ruby and the
      # bundle installed the lane dies at step 2 with "bundle: not found".
      # Same action, version and inputs as the Spec Sync job in ci.yml.
      - name: Set up Ruby 3.3
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler: '2.4.22'
          bundler-cache: true

      - uses: CorvidLabs/trust@dd52a7a90ffbc1d2b1030e37007c18274f3d96bc # v1.2.1
        id: trust
