schema_version = 1
profile = "standard"

[lifecycle]
command = ["fledge", "lanes", "run", "verify"]

[contract]
enabled = true
require_coverage = 100
skip_reason = ""

[risk]
threshold = "block"

[provenance]
mode = "off"
policy = ".attest.json"
skip_reason = "Provenance required a manual signing step before every release. It was skipped for v0.4.0, v0.5.0 and v0.6.0 and nobody noticed, because the only thing gated on it was a GitHub Packages gem that nothing installs - the Homebrew formula builds from the tag tarball and the rubygems.org job is disabled. Enforcing it instead blocked releases on a human keystroke. A gate that is either skipped silently or blocks the work is not buying safety, so it is off and recorded as off rather than left to fail."

[atlas]
enabled = false
skip_reason = "Atlas publication was not enabled during adoption"
