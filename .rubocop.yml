AllCops:
  TargetRubyVersion: 3.0
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "*.gemspec"
    # Captured measurement harnesses, kept as evidence rather than maintained.
    # Reformatting them to project style would edit the thing that produced the
    # numbers in the changelog.
    - "harnesses/**/*"

Style/Documentation:
  Enabled: false

Metrics/MethodLength:
  Max: 20

Metrics/AbcSize:
  Max: 25

Layout/LineLength:
  Max: 120

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
